<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Jeffrey Olvis | Licensed Civil Engineer & Cost Consultant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Corporate Civil Engineering Palette */
            --primary: #0f172a;        /* Steel Navy */
            --primary-light: #1e293b;  /* Deep Slate */
            --accent: #2563eb;         /* Engineering Blue */
            --accent-gold: #d97706;    /* Concrete / Safety Amber */
            --bg: #f8fafc;             /* Light Concrete Tint */
            --surface: #ffffff;
            --text: #334155;           /* Charcoal Text */
            --text-muted: #64748b;     /* Muted Blueprint Slate */
            --border: #cbd5e1;         /* Structural Frame Border */
            --border-light: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
            --radius: 6px;             /* Crisp technical corners */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* --- Blueprint Header / Hero --- */
        header {
            background-color: var(--primary);
            /* Subtle Blueprint Grid Pattern Background */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            color: white;
            padding: 4.5rem 0 3.5rem;
            border-bottom: 4px solid var(--accent);
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .hero-text {
            flex: 1;
            min-width: 320px;
        }

        .hero-text h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: -0.025em;
            color: #ffffff;
        }

        .hero-text h2 {
            font-size: 1.25rem;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hero-text h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            border-radius: 50%;
        }

        .badges {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .badge-cert {
            background: rgba(37, 99, 235, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(147, 197, 253, 0.3);
            padding: 0.35rem 0.85rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .hero-contact {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .hero-contact a, .hero-contact span {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.5rem 0.9rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .hero-contact a:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Hero Profile Frame */
        .profile-photo-container {
            width: 180px;
            height: 180px;
            border-radius: 6px;
            border: 3px solid var(--accent);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            background: var(--primary-light);
            flex-shrink: 0;
            position: relative;
        }

        .profile-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- Executive Metrics Scorecard --- */
        .metrics-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-top: -2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            divide-x: 1px solid var(--border-light);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .metric-item {
            padding: 1.25rem;
            text-align: center;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- Sticky Engineering Nav --- */
        nav {
            background: var(--surface);
            border-bottom: 2px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 1.1rem 0;
            display: block;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* --- Main Content Sections --- */
        section {
            padding: 3.5rem 0;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 1.75rem;
            position: relative;
            display: inline-block;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 45px;
            height: 3px;
