<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Jeffrey Olvis | Licensed Civil Engineer & Cost Consultant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1120;
            --primary-light: #162238;
            --accent: #2563eb;
            --accent-glow: #00f2fe;
            --bg: #0d1527;
            --surface: rgba(22, 34, 56, 0.85);
            --surface-hover: rgba(30, 45, 74, 0.95);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(56, 189, 248, 0.2);
            --border-accent: rgba(0, 242, 254, 0.5);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            /* Engineering Blueprint Grid pattern */
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Header / Hero */
        header {
            background: linear-gradient(135deg, #070d19 0%, #0f172a 100%);
            border-bottom: 2px solid var(--border);
            padding: 4.5rem 0 3.5rem;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .hero-text h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
            background: linear-gradient(90deg, #ffffff, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text h2 {
            font-size: 1.3rem;
            color: var(--accent-glow);
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badges {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .badge-cert {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-glow);
            border: 1px solid var(--border-accent);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .hero-contact {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hero-contact a {
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }

        .hero-contact a:hover {
            background: var(--accent);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        /* Navigation */
        nav {
            background: rgba(10, 17, 32, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            padding: 1rem 0;
            display: block;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-glow);
            border-bottom-color: var(--accent-glow);
        }

        /* Main Sections */
        section {
            padding: 4rem 0;
        }

        .section-title {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 50px;
            height: 3px;
            background: var(--accent-glow);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* About / Summary */
        .profile-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            font-size: 1.05rem;
            line-height: 1.7;
            backdrop-filter: blur(8px);
        }

        /* Competencies & Tools Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .skill-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-3px);
        }

        .skill-card h3 {
            font-size: 1.15rem;
            color: #ffffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .skill-card h3 i {
            color: var(--accent-glow);
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: rgba(37, 99, 235, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Experience Timeline */
        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2.5rem;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
