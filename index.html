<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Jeffrey Olvis | Licensed Civil Engineer & Cost Consultant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #070d19;
            --accent: #2563eb;
            --accent-glow: #00f2fe;
            --bg: #0b1329;
            --surface: rgba(15, 23, 42, 0.75);
            --surface-hover: rgba(23, 37, 66, 0.85);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(0, 242, 254, 0.15);
            --border-glow: rgba(0, 242, 254, 0.4);
            --shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
            --radius: 12px;
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            /* Architectural CAD / Blueprint Grid Overlay */
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.15), transparent 70%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Header / Structural Hero Section */
        header {
            position: relative;
            background: linear-gradient(180deg, rgba(7, 13, 25, 0.95) 0%, rgba(11, 19, 41, 0.8) 100%),
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            border-bottom: 1px solid var(--border);
            padding: 5rem 0 4rem;
            overflow: hidden;
        }

        /* Overlay structural line highlight */
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
